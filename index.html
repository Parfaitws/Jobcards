<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF8F2">
<title>Parfait Job Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0E1F4D; --navy-2:#1A2C60; --gold:#D2B27A; --gold-ink:#7C5E2C;
  --bg:#FAF7F1; --head:#FFFFFF; --wall:#F5EDDC; --card:#FFFFFF; --line:#E2DACB; --ink:#1B2233; --muted:#4F5667;
  --chip:#F1EADC; --chip-ink:#6B5023; --warn-bg:#FBE9CC; --warn-ink:#6A3A00;
  --btn-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320; --card:#171C2C; --line:#2A3147; --ink:#EDEFF5; --muted:#A9B0C2;
    --chip:#2A2A2E; --chip-ink:#E3C893; --warn-bg:#3A2A12; --warn-ink:#F4D19A;
    --gold-ink:#E3C893;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320; --card:#171C2C; --line:#2A3147; --ink:#EDEFF5; --muted:#A9B0C2;
  --chip:#2A2A2E; --chip-ink:#E3C893; --warn-bg:#3A2A12; --warn-ink:#F4D19A;
  --gold-ink:#E3C893;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--head)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Figtree','Helvetica Neue',Helvetica,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--ink);border-bottom:1px solid var(--line)}
.bar{max-width:520px;margin:0 auto;height:64px;padding:0 12px 0 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:.2em;color:var(--navy)}
.brand small{font-size:11px;color:var(--gold-ink);margin-top:3px;letter-spacing:.04em}
.langs{display:flex;gap:2px;padding:2px;border-radius:12px;background:var(--chip)}
.langs button{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--navy);color:#fff}

main{max-width:520px;margin:0 auto;padding:22px 20px 40px}
.screen{display:flex;flex-direction:column;gap:18px}
.screen[hidden]{display:none}
.kicker{font-size:14px;font-weight:600;color:var(--gold-ink)}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px;line-height:1.05;color:var(--ink)}
h2{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;color:var(--ink)}
.sub{font-size:15px;color:var(--muted)}
.prop{font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--brass,#8a6a2f);margin:2px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.addr{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.addr strong{display:block;font-size:17px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{min-height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;text-decoration:none;border:1.5px solid var(--navy);background:transparent;color:var(--ink);text-align:center;padding:4px 10px}
:root[data-theme="dark"] .btn,.dark-btn{border-color:#8FA0D0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{border-color:#8FA0D0}}
.btn.solid{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn .tiny{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.crew{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crew>span{font-size:14px;font-weight:600;color:var(--muted);min-width:56px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500}
.pill i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--chip-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.rooms-head{display:flex;align-items:baseline;justify-content:space-between}
.rooms-head span{font-size:14px;font-weight:600;color:var(--gold-ink)}
.rooms{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.room{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;color:inherit}
.badge{width:38px;height:38px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--chip);color:var(--chip-ink)}
.room.done .badge{background:var(--navy);color:#fff}
.room .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.room .txt b{font-size:17px}
.room .txt small{font-size:14px;color:var(--muted)}
.warn-chip{flex-shrink:0;padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;font-weight:700}
.finish{min-height:56px;border-radius:14px;font-size:16px;font-weight:700;border:1.5px solid var(--navy);background:transparent;color:var(--ink)}
.finish.ready{background:var(--navy);color:#fff}

.back{align-self:flex-start;min-height:44px;display:flex;align-items:center;gap:6px;padding:0 12px 0 2px;background:transparent;border:0;color:var(--ink);font-size:15px;font-weight:600;margin:-10px 0 -6px}
.warn{display:flex;gap:10px;padding:12px 14px;background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;font-size:15px;line-height:1.4}
.wall{background:var(--wall);color:var(--navy);border:1px solid #E8D9B8;border-radius:16px;padding:16px}
.wall span{display:block;font-size:13px;font-weight:600;color:var(--gold-ink)}
.walls{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.walls li{display:flex;align-items:baseline;gap:12px;padding-top:8px;border-top:1px solid #E8D9B8}
.walls li:first-child{border-top:0;padding-top:0}
.walls li em{font-style:normal;font-size:14px;font-weight:700;color:var(--gold-ink);min-width:62px}
.walls li b{font-size:24px;letter-spacing:-.01em}
.walls li .wd{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.walls li.tbd b{font-size:17px;color:var(--warn-ink)}
.paper{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.swatch img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.swatch.has-img{padding:0;border-style:solid}
.swatch{width:76px;height:76px;flex-shrink:0;border-radius:10px;background:var(--chip);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:600;color:var(--chip-ink);line-height:1.2;padding:4px}
.paper small{display:block;font-size:13px;color:var(--muted)}
.paper b{display:block;font-size:20px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.spec{background:var(--bg);border-radius:10px;padding:10px 12px}
.spec small{display:block;font-size:12px;color:var(--muted)}
.spec b{display:block;font-size:15px}
.note{margin-bottom:14px}
.scope small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.scope #d-scope{font-size:17px;line-height:1.45;font-weight:500}
.facts{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line,#e8e0d2);display:grid;gap:6px}
.facts li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.facts li span{color:var(--muted)}
.facts li b{text-align:right}
.note small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.nolink{border-style:dashed;color:var(--muted)}
.mark{min-height:56px;border-radius:14px;font-size:16px;font-weight:700;border:0;background:var(--navy);color:#fff}
.mark.on{background:var(--chip);color:var(--chip-ink);border:1.5px solid var(--gold)}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pager .btn[disabled]{opacity:.35}

.photos-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.photos-head b{font-size:17px}
.photos-head small{font-size:13px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.thumb{position:relative;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip);aspect-ratio:4/3}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:6px;bottom:6px;padding:3px 8px;border-radius:999px;background:rgba(14,31,77,.85);color:#fff;font-size:12px;font-weight:700}
.cam{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);flex-shrink:0}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,14,24,.94);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lb-top{display:flex;align-items:center;justify-content:space-between;color:#fff;min-height:48px}
.lb-top b{font-size:16px}
.lb-x{width:48px;height:48px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lb-nav button{min-height:52px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600}
.lb-nav button[disabled]{opacity:.3}

.ptab{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ptab-btn{width:100%;min-height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border:0;background:transparent;color:var(--ink);text-align:left}
.ptab-btn b{font-size:17px}
.ptab-btn small{margin-left:auto;font-size:14px;font-weight:600;color:var(--gold-ink)}
.ptab-btn .chev{flex-shrink:0;color:var(--muted);transition:transform .15s}
.ptab-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ptab-btn:disabled{cursor:default;color:var(--muted)}
.ptab-btn:disabled small{color:var(--muted);font-weight:500}
.ptab-btn:disabled .chev{display:none}
.ptab .thumbs{padding:0 16px 16px}
.shot{display:flex;flex-direction:column;gap:6px}
.shot .thumb{width:100%}
.shot .cap b{display:block;font-size:15px}
.shot .cap small{display:block;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.screen{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><b>PARFAIT</b><small id="t-sub">Job card</small></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="es" aria-pressed="false">ES</button>
      <button data-lang="pt" aria-pressed="false">PT</button>
    </div>
  </div>
</header>

<main>
  <section class="screen" id="overview">
    <div>
      <div class="kicker" id="t-today"></div>
      <h1 id="j-name"></h1>
      <div class="prop" id="j-prop" hidden></div>
      <div class="sub" id="t-time"></div>
    </div>

    <div class="card">
      <div class="addr">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-ink);flex-shrink:0;margin-top:2px" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <div><strong id="j-addr"></strong><span class="sub" id="j-city"></span></div>
      </div>
      <div class="two">
        <a class="btn solid" id="j-maps" href="#" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
          <span id="t-maps"></span></a>
        <a class="btn" id="j-tel" href="#"><span><span id="t-call"></span><span class="tiny" id="j-phone"></span></span></a>
      </div>
    </div>

    <div class="crew">
      <span id="t-team"></span>
      <span id="j-crew" style="display:contents"></span>
    </div>

    <div class="rooms-head"><h2 id="t-rooms"></h2><span id="done-count"></span></div>
    <ul class="rooms" id="room-list"></ul>

    <button class="finish" id="finish" type="button"></button>
  </section>

  <section class="screen" id="detail" hidden>
    <button class="back" id="back" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      <span id="t-back"></span></button>
    <div>
      <div class="kicker" id="d-of"></div>
      <h1 id="d-name"></h1>
      <div class="sub" id="d-area"></div>
    </div>
    <div class="warn" id="d-warn" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0" aria-hidden="true"><path d="M12 3l9.5 17h-19L12 3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>
      <span id="d-warn-t"></span>
    </div>
    <div class="card scope" id="d-scope-wrap" hidden><small id="t-scope"></small><div id="d-scope"></div><ul class="facts" id="d-facts"></ul></div>
    <div class="wall"><span id="t-wall"></span><ol class="walls" id="d-wall"></ol></div>
    <div class="card">
      <div class="paper">
        <div class="swatch" id="t-photo"></div>
        <div><small id="t-paper"></small><b id="d-paper"></b><small id="d-brand"></small></div>
      </div>
      <div class="specs" id="d-specs"></div>
      <div class="note" id="d-note-wrap"><small id="t-notes"></small><div id="d-note"></div></div>
      <a class="btn" id="d-link" target="_blank" rel="noopener"></a>
      <div class="btn nolink" id="d-nolink" hidden></div>
    </div>
    <div class="ptab" id="d-photos">
      <button class="ptab-btn" id="ptab-btn" type="button" aria-expanded="false" aria-controls="d-thumbs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <b id="t-sitephotos"></b><small id="d-photo-count"></small>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="thumbs" id="d-thumbs" hidden></div>
    </div>
    <button class="mark" id="mark" type="button"></button>
    <div class="pager">
      <button class="btn" id="prev" type="button"></button>
      <button class="btn" id="next" type="button"></button>
    </div>
  </section>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true">
  <div class="lb-top"><b id="lb-cap"></b><button class="lb-x" id="lb-x" type="button" aria-label="Close">×</button></div>
  <div class="lb-img"><img id="lb-img" alt=""></div>
  <div class="lb-nav"><button id="lb-prev" type="button"></button><button id="lb-next" type="button"></button></div>
</div>
<script>
function start(){
const T = {
  en:{sub:'Job card',today:'Friday, Oct 16',time:'8:00 AM to 1:30 PM, proposal #3320382',crewtbd:'Crew to confirm',maps:'Open in Maps',call:'Call contact',phone:'[client phone]',team:'Crew',rooms:'Rooms',done:(n,t)=>`${n} of ${t} done`,back:'All rooms',of:(i,t)=>`Room ${i} of ${t}`,wall:'Walls to cover',scope:'Scope of work',wallN:n=>n==='c'?'Ceiling':`Wall ${n}`,tbd:'Size to confirm',sitephotos:'Site photos',nophotos:'No photos',nphotos:n=>n===1?'1 photo':`${n} photos`,paperTbd:'Wallpaper to confirm',photo:'Paper',paper:'Wallpaper',notes:'Notes',view:'View product',noLink:'No product link',mark:'Mark room as done',marked:'Room done, tap to undo',finish:'Finish job',finishReady:'All rooms done, finish job',check:'Check',prev:'Previous',next:'Next room',finished:'Job finished. Nice work.',
    s:{rolls:'Rolls',roll:'Roll size',repeat:'Pattern repeat',material:'Material',colorway:'Color',batch:'Batch'}},
  es:{sub:'Orden de trabajo',today:'Viernes 16 de oct',time:'8:00 AM a 1:30 PM, propuesta #3320382',crewtbd:'Equipo por confirmar',maps:'Abrir en Maps',call:'Llamar al contacto',phone:'[teléfono del cliente]',team:'Equipo',rooms:'Ambientes',done:(n,t)=>`${n} de ${t} listos`,back:'Todos los ambientes',of:(i,t)=>`Ambiente ${i} de ${t}`,wall:'Paredes a cubrir',scope:'Descripción del trabajo',wallN:n=>n==='c'?'Techo':`Pared ${n}`,tbd:'Medida por confirmar',sitephotos:'Fotos del lugar',nophotos:'Sin fotos',nphotos:n=>n===1?'1 foto':`${n} fotos`,paperTbd:'Papel por confirmar',photo:'Papel',paper:'Papel tapiz',notes:'Notas',view:'Ver producto',noLink:'Sin link del producto',mark:'Marcar ambiente como listo',marked:'Ambiente listo, toca para deshacer',finish:'Terminar trabajo',finishReady:'Todo listo, terminar trabajo',check:'Revisar',prev:'Anterior',next:'Siguiente',finished:'Trabajo terminado. Buen trabajo.',
    s:{rolls:'Rollos',roll:'Medida del rollo',repeat:'Repetición',material:'Material',colorway:'Color',batch:'Lote'}},
  pt:{sub:'Ordem de serviço',today:'Sexta, 16 de out',time:'8:00 às 13:30, proposta #3320382',crewtbd:'Equipe a confirmar',maps:'Abrir no Maps',call:'Ligar p/ contato',phone:'[telefone do cliente]',team:'Equipe',rooms:'Ambientes',done:(n,t)=>`${n} de ${t} prontos`,back:'Todos os ambientes',of:(i,t)=>`Ambiente ${i} de ${t}`,wall:'Paredes a cobrir',scope:'Descrição do serviço',wallN:n=>n==='c'?'Teto':`Parede ${n}`,tbd:'Medida a confirmar',sitephotos:'Fotos do local',nophotos:'Sem fotos',nphotos:n=>n===1?'1 foto':`${n} fotos`,paperTbd:'Papel a confirmar',photo:'Papel',paper:'Papel de parede',notes:'Observações',view:'Ver produto',noLink:'Sem link do produto',mark:'Marcar ambiente como pronto',marked:'Ambiente pronto, toque p/ desfazer',finish:'Finalizar trabalho',finishReady:'Tudo pronto, finalizar trabalho',check:'Conferir',prev:'Anterior',next:'Próximo',finished:'Trabalho finalizado. Bom trabalho.',
    s:{rolls:'Rolos',roll:'Medida do rolo',repeat:'Repetição',material:'Material',colorway:'Cor',batch:'Lote'}}
};
const trad={en:'Traditional',es:'Tradicional',pt:'Tradicional'};
const ROOMS=JOB.rooms;
const KEY='parfait-jobcard-'+JOBID;
let S={lang:'en',done:{},room:-1,finished:false};
let PO=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)S=Object.assign(S,saved,{room:-1});}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({lang:S.lang,done:S.done,finished:S.finished}))}catch(e){}};
const $=id=>document.getElementById(id);
const p=v=>(v&&typeof v==='object')?v[S.lang]:v;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const t=T[S.lang];
  document.documentElement.lang=S.lang;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  ['sub','maps','call','team','rooms','back','wall','paper','notes'].forEach(k=>{const el=$('t-'+k);if(el)el.textContent=t[k];});
  $('t-today').textContent=p(JOB.today);$('j-prop').hidden=!JOB.proposal;$('j-prop').textContent=JOB.proposal?({en:'Proposal',es:'Propuesta',pt:'Proposta'}[S.lang])+' #'+JOB.proposal:'';$('t-time').textContent=p(JOB.time);
  const n=ROOMS.filter((_,i)=>S.done[i]).length;
  $('done-count').textContent=t.done(n,ROOMS.length);
  $('room-list').innerHTML=ROOMS.map((r,i)=>`<li><button class="room${S.done[i]?' done':''}" data-i="${i}" type="button">
    <span class="badge">${S.done[i]?'✓':i+1}</span>
    <span class="txt"><b>${esc(p(r.name))}</b><small>${esc(r.paper||t.paperTbd)}${r.rolls?`, ${esc(r.rolls)} ${esc(t.s.rolls.toLowerCase())}`:''}</small></span>
    ${r.photos&&r.photos.length?`<span class="cam"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${r.photos.length}</span>`:''}
    ${r.warn&&!S.done[i]?`<span class="warn-chip">${esc(t.check)}</span>`:''}
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex-shrink:0" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button></li>`).join('');
  const all=n===ROOMS.length;
  const f=$('finish');
  f.className='finish'+(all?' ready':'');
  f.textContent=S.finished?t.finished:(all?t.finishReady:t.finish);

  $('overview').hidden=S.room>=0;
  $('detail').hidden=S.room<0;
  if(S.room>=0){
    const r=ROOMS[S.room],i=S.room;
    $('d-of').textContent=t.of(i+1,ROOMS.length);
    $('d-name').textContent=p(r.name);
    $('d-area').textContent=p(r.area);
    $('d-warn').hidden=!r.warn; $('d-warn-t').textContent=r.warn?p(r.warn):'';
    $('d-scope-wrap').hidden=!r.scope;$('t-scope').textContent=t.scope;$('d-scope').textContent=r.scope?p(r.scope):'';$('d-facts').innerHTML=(r.facts||[]).map(x=>`<li><span>${esc(p(x.k))}</span><b>${esc(p(x.v))}</b></li>`).join('');$('d-facts').hidden=!(r.facts&&r.facts.length);
    $('d-wall').innerHTML=r.walls.map((w,k)=>`<li class="${w&&w.s?'':'tbd'}"><em>${esc(t.wallN(w&&w.n?w.n:k+1))}</em><div><b>${esc(w&&w.s?p(w.s):t.tbd)}</b>${w&&w.d?`<small class="wd">${esc(p(w.d))}</small>`:''}</div></li>`).join('');
    const sw=$('t-photo');if(r.swatch){sw.classList.add('has-img');sw.innerHTML=`<img src="${r.swatch}" alt="${esc(r.paper||'')}">`;}else{sw.classList.remove('has-img');}$('d-paper').textContent=r.paper||t.paperTbd; $('d-brand').textContent=r.brand;
    $('d-specs').hidden=!r.specs.length;$('d-specs').innerHTML=r.specs.map(([k,v])=>`<div class="spec"><small>${esc(t.s[k])}</small><b>${esc(p(v))}</b></div>`).join('');
    $('d-note-wrap').hidden=!r.note; $('d-note').textContent=r.note?p(r.note):'';
    const l=$('d-link');
    if(r.link){l.hidden=false;l.href=r.link;l.innerHTML=`${esc(t.view)} <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`;$('d-nolink').hidden=true;}
    else{l.hidden=true;$('d-nolink').hidden=false;$('d-nolink').textContent=t.noLink;}
    const ph=r.photos||[];
    const pb=$('ptab-btn');
    pb.disabled=!ph.length;
    pb.setAttribute('aria-expanded',PO&&ph.length?'true':'false');
    $('d-thumbs').hidden=!(PO&&ph.length);
    $('t-sitephotos').textContent=t.sitephotos;
    $('d-photo-count').textContent=ph.length?t.nphotos(ph.length):t.nophotos;
    $('d-thumbs').innerHTML=ph.map((x,k)=>`<div class="shot"><button class="thumb" type="button" data-k="${k}"><img src="${x.src}" alt="${esc(photoCap(x,t))}" loading="lazy"></button><div class="cap"><b>${esc(photoCap(x,t))}</b>${wsize(r,x.wall)?`<small>${esc(wsize(r,x.wall))}</small>`:''}</div></div>`).join('');
    const m=$('mark'); m.className='mark'+(S.done[i]?' on':''); m.textContent=S.done[i]?t.marked:t.mark;
    $('prev').textContent=t.prev; $('prev').disabled=i===0;
    $('next').textContent=t.next; $('next').disabled=i===ROOMS.length-1;
  }
}
function go(room,push=true){
  S.room=room;LB=-1;PO=false;
  if(push)history.pushState({room},'',room>=0?'#room-'+(room+1):'#');
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.lang;save();render();renderLB();}));
$('room-list').addEventListener('click',e=>{const b=e.target.closest('.room');if(b)go(+b.dataset.i);});
$('back').addEventListener('click',()=>go(-1));
$('prev').addEventListener('click',()=>go(S.room-1));
$('next').addEventListener('click',()=>go(S.room+1));
$('mark').addEventListener('click',()=>{S.done[S.room]=!S.done[S.room];if(!S.done[S.room])S.finished=false;save();render();});
$('finish').addEventListener('click',()=>{if(ROOMS.every((_,i)=>S.done[i])){S.finished=true;save();render();}});
window.addEventListener('popstate',e=>{const r=(e.state&&typeof e.state.room==='number')?e.state.room:-1;go(r,false);});
const m=location.hash.match(/room-(\d)/); if(m){S.room=Math.min(ROOMS.length,Math.max(1,+m[1]))-1;}

let LB=-1;
$('ptab-btn').addEventListener('click',()=>{PO=!PO;render();});
function wsize(r,n){const w=(r.walls||[]).find(w=>w&&w.n===n);return w?p(w.s):'';}
function photoCap(ph,t){return ph.wall?t.wallN(ph.wall):(ph.cap?p(ph.cap):t.sitephotos);}
function renderLB(){
  const t=T[S.lang],r=ROOMS[S.room],lb=$('lb');
  if(LB<0||!r||!r.photos||!r.photos[LB]){lb.hidden=true;return;}
  const ph=r.photos[LB];
  lb.hidden=false;$('lb-img').src=ph.src;$('lb-img').alt=photoCap(ph,t);
  $('lb-cap').textContent=`${photoCap(ph,t)}${wsize(r,ph.wall)?', '+wsize(r,ph.wall):''} (${LB+1}/${r.photos.length})`;
  $('lb-prev').textContent=t.prev;$('lb-prev').disabled=LB===0;
  $('lb-next').textContent=t.next;$('lb-next').disabled=LB===r.photos.length-1;
}
$('d-thumbs').addEventListener('click',e=>{const b=e.target.closest('.thumb');if(b){LB=+b.dataset.k;renderLB();}});
$('lb-x').addEventListener('click',()=>{LB=-1;renderLB();});
$('lb-prev').addEventListener('click',()=>{LB--;renderLB();});
$('lb-next').addEventListener('click',()=>{LB++;renderLB();});
document.addEventListener('keydown',e=>{if(LB>=0&&e.key==='Escape'){LB=-1;renderLB();}});
history.replaceState({room:S.room},'');
function setupJob(){
  document.title='Parfait Job Card · '+JOB.client;
  $('j-name').textContent=JOB.client;
  $('j-addr').textContent=JOB.address;$('j-city').textContent=JOB.city;
  $('j-maps').href='https://maps.google.com/?q='+encodeURIComponent(JOB.address+', '+JOB.city);
  $('j-tel').href='tel:+1'+String(JOB.phone).replace(/\D/g,'').slice(-10);
  $('j-phone').textContent=JOB.phone;
  if(!JOB.phone){$('j-tel').style.display='none';$('j-tel').parentElement.style.gridTemplateColumns='1fr';}
  $('j-crew').innerHTML=(JOB.crew||[]).map(n=>`<span class="pill"><i>${esc(n.charAt(0))}</i>${esc(n)}</span>`).join('');
}
setupJob();
render();
}
const JOBID=(new URLSearchParams(location.search).get('j')||'').replace(/[^a-z0-9-]/gi,'');
function notFound(){document.querySelector('main').innerHTML='<section class="screen"><h1>Job card not found</h1><p class="sub">Check the link with the office. / Revisa el link con la oficina. / Confira o link com o escritório.</p></section>';}
if(!JOBID){notFound();}
else{const sc=document.createElement('script');sc.src=JOBID+'.js?v='+Date.now();sc.onload=()=>{if(window.JOB)start();else notFound();};sc.onerror=notFound;document.head.appendChild(sc);}
</script>
</body>
</html>
